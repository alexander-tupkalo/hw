<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <title>Todo List</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/css.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="./scripts/main.js" defer type="module"></script>
  </head>

  <body>
    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-8">
            <div class="todo-content-wrapper">
              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <div>
                  <h1 class="h2 mb-3">Todo List</h1>
                </div>

                <button type="button" class="btn btn-primary" data-action="add">
                  + Add
                </button>
              </div>

              <form class="mb-3" data-search-form>
                <label for="search" class="form-label"> Search tasks </label>

                <input
                  type="search"
                  id="search"
                  name="search"
                  class="form-control"
                  placeholder="Enter a title or description..."
                  data-search-input
                />
              </form>

              <div
                class="btn-group w-100 mb-4"
                role="group"
                aria-label="Filter tasks"
                data-filter-group
              >
                <button
                  type="button"
                  class="btn btn-outline-primary active"
                  data-filter="all"
                >
                  All
                </button>

                <button
                  type="button"
                  class="btn btn-outline-primary"
                  data-filter="active"
                >
                  Active
                </button>

                <button
                  type="button"
                  class="btn btn-outline-primary"
                  data-filter="completed"
                >
                  Completed
                </button>
              </div>

              <div class="list-group list-group-scroll" data-todo-list>
                <p class="text-secondary text-center py-4 mb-0">
                  Loading tasks...
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="todo-modal"
        tabindex="-1"
        aria-labelledby="todo-modal-title"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <form data-todo-form>
              <div class="modal-header">
                <h2 class="modal-title fs-5" id="todo-modal-title">New Task</h2>

                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>

              <div class="modal-body">
                <input type="hidden" name="id" />

                <div class="mb-3">
                  <label for="todo-title" class="form-label">
                    Task Title
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="todo-title"
                    name="title"
                    maxlength="100"
                    required
                    placeholder="For example, prepare the bar"
                  />
                </div>

                <div class="mb-3">
                  <label for="todo-description" class="form-label">
                    Description
                  </label>

                  <textarea
                    class="form-control"
                    id="todo-description"
                    name="description"
                    rows="3"
                    maxlength="500"
                    placeholder="Add task details..."
                  ></textarea>
                </div>
              </div>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>

                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="delete-modal"
        tabindex="-1"
        aria-labelledby="delete-modal-title"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="delete-modal-title">
                Delete Task?
              </h2>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <div class="modal-body">
              Are you sure you want to delete this task?
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button type="button" class="btn btn-danger" data-confirm-delete>
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
